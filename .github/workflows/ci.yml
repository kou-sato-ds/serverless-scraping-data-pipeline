# =====================================================================
# CI: Beam ユニットテスト自動実行
#
# 🎯 【人間の記憶に依存しない検証層】pushのたびにテストが自動で走る!
#
# 背景:
#   #68-#71 で21件のテストを緑にしたが、それらは全て
#   「佐藤が手元で pytest を打つことを覚えている限り」でしか実行されない。
#   本ワークフローは push / PR のたびに自動実行し、
#   「実行し忘れ」という人的要因を構造的に排除する。
#
#   また #71 の STAGE 5 は google-cloud-* が導入された環境でのみ
#   実行される条件付き検証だった。CIで依存を明示インストールすることで、
#   「常に検証される」状態へ引き上げる。
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 👉 手動実行も可能にしておく(障害調査時に便利)

jobs:
  test:
    name: Run Beam unit tests
    runs-on: ubuntu-latest

    steps:
      # 🚀 【STAGE 1: コード取得】リポジトリをCIランナーへチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🚀 【STAGE 2: Python環境】ローカルと同じ系列のPythonを用意
      #    ローカルは 3.14 だが、apache-beam の公式サポート範囲に合わせ 3.12 を使う
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # 👉 依存を再利用しCI実行時間を短縮(TCO意識)

      # 🚀 【STAGE 3: 依存インストール】#71 STAGE5 を skip させないため GCP SDK も入れる
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 03_cloud_architecture/requirements-test.txt

      # 🚀 【STAGE 4: テスト実行】テスト対象は #68-#71 の4ファイル
      #    -v で個別結果を出し、失敗時にどのテストが落ちたかログで即特定できる
      - name: Run pytest
        working-directory: 03_cloud_architecture
        run: pytest 68_dataflow_pipeline_testing.py 69_dataflow_sideinput_window_testing.py 70_bigquery_merge_logic_testing.py 71_import_based_regression_testing.py -v